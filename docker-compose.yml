# Aggregates all homelab apps. Each app gets its own port starting at 6000, and
# an nginx `proxy` service fronts them all: HTTPS on host 443 (self-signed cert,
# HTTP on 80 redirects to it), routing by path (e.g. <ip>/atc, <ip>/receptenboek,
# dashboard at <ip>/). The per-app 600x ports stay published for direct access.
# To add an app: create apps/<name> with a Dockerfile, add a service below on the
# next free port, and add an nginx `location` block in proxy/nginx.conf.
services:
  # Shared PostgreSQL database. One container fronts all data-owning apps; each
  # app gets its own role + schema, provisioned on first boot (see db/init). No
  # host port is published — it's internal-only, reachable as host `db`. Secrets
  # self-generate into the db-secrets volume, so `docker compose up` needs no
  # manual passwords. See docs/database-migration.md.
  db:
    image: postgres:17-alpine
    container_name: postgres
    labels:
      # Not an app tile on the dashboard.
      - 'homelab.enable=false'
    # Wrapper generates the superuser password on first boot, then execs the
    # stock entrypoint. Run via sh so no +x bit is required on the mounted file.
    entrypoint: ['/bin/sh', '/db-entrypoint.sh']
    environment:
      - POSTGRES_DB=homelab
      - POSTGRES_USER=postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Generated per-app credentials (read-write here; apps mount this read-only).
      - db-secrets:/secrets
      # Bootstrap wrapper + role/schema provisioning (read-only). provision-roles.sh
      # is the shared, idempotent provisioner run both on fresh init (init/10-roles.sh)
      # and on every boot (entrypoint.sh) so newly added apps are picked up.
      - ./db/entrypoint.sh:/db-entrypoint.sh:ro
      - ./db/provision-roles.sh:/provision-roles.sh:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d homelab']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reverse proxy: the single public entrypoint on 80/443. See proxy/nginx.conf.
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: proxy
    labels:
      # Don't auto-list the proxy itself as a dashboard tile.
      - 'homelab.enable=false'
    ports:
      - '80:80'
      - '443:443'
    environment:
      # subjectAltName for the self-signed cert generated on first boot. Add the
      # Pi's LAN IP/hostname here (e.g. ,IP:192.168.1.50) so the cert names it.
      - TLS_SAN=DNS:localhost,IP:127.0.0.1
    volumes:
      # nginx.conf and proxy_common are baked into the image (see proxy/Dockerfile),
      # so `docker compose up -d --build` recreates the proxy on any config change.
      # Persistent self-signed cert (generated on first boot, reused after).
      - proxy-certs:/etc/nginx/certs
    depends_on:
      - dashboard
      - atc
      - ev-crossover
      - dynamic-vs-fixed
      - recipe-book
      - log-viewer
      - notification
      - auth
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  atc:
    build:
      context: .
      dockerfile: apps/atc/Dockerfile
    container_name: atc-frontend
    labels:
      - 'homelab.name=ATC'
      - 'homelab.icon=✈️'
    ports:
      # Host 6001 avoids Home Assistant's used ports (80/443 proxy, 8123, 1883, 4357)
      - '6001:6001'
    extra_hosts:
      # Reach the MQTT broker published on the host (Home Assistant's mosquitto).
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=production
      - PORT=6001
      - LOG_DIR=/app/logs
      # MQTT: connect to the host broker and subscribe to MQTT_TOPIC (default "#",
      # all topics). Known topics are parsed (the EHAM runway config, exposed at
      # /api/runways); unknown topics are logged. Unset MQTT_URL to disable.
      # Anonymous auth; set MQTT_USERNAME/MQTT_PASSWORD if required.
      - MQTT_URL=mqtt://host.docker.internal:1883
      - 'MQTT_TOPIC=#'
      # - MQTT_USERNAME=
      # - MQTT_PASSWORD=
    volumes:
      - atc-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ev-crossover:
    build:
      context: .
      dockerfile: apps/ev-crossover/Dockerfile
    container_name: ev-crossover
    labels:
      - 'homelab.name=Laden of tanken?'
      - 'homelab.icon=🔌'
    ports:
      - '6002:6002'
    environment:
      - NODE_ENV=production
      - PORT=6002
      - LOG_DIR=/app/logs
    volumes:
      - ev-crossover-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dynamic-vs-fixed:
    build:
      context: .
      dockerfile: apps/dynamic-vs-fixed/Dockerfile
    container_name: dynamic-vs-fixed
    labels:
      - 'homelab.name=Dynamisch of vast contract?'
      - 'homelab.icon=⚡'
    ports:
      - '6003:6003'
    environment:
      - NODE_ENV=production
      - PORT=6003
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    volumes:
      - dynamic-vs-fixed-data:/app/data
      - dynamic-vs-fixed-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  log-viewer:
    build:
      context: .
      dockerfile: apps/log-viewer/Dockerfile
    container_name: log-viewer
    labels:
      - 'homelab.name=Logs'
      - 'homelab.icon=🪲'
    ports:
      - '6004:6004'
    environment:
      - NODE_ENV=production
      - PORT=6004
      - LOG_DIR=/app/logs
      # Every app's log volume is mounted read-only under here, one subdir each.
      - LOGS_ROOT=/logs
      # When set, new server-error (>=500) requests trigger a push via the
      # notification app (reached by container name on the internal network).
      - NOTIFICATION_URL=http://notification:6006
      - SEND_TOKEN=${SEND_TOKEN:-}
    volumes:
      # Read-only mounts of every app's access-log volume (incl. its own), so
      # the viewer can read the full daily-rotated, gzipped 1-month history.
      - atc-logs:/logs/atc:ro
      - ev-crossover-logs:/logs/ev-crossover:ro
      - dynamic-vs-fixed-logs:/logs/dynamic-vs-fixed:ro
      - dashboard-logs:/logs/dashboard:ro
      - recipe-book-logs:/logs/recipe-book:ro
      - log-viewer-logs:/logs/log-viewer:ro
      - notification-logs:/logs/notification:ro
      - auth-logs:/logs/auth:ro
      # Read-write target for this app's own access log.
      - log-viewer-logs:/app/logs
    depends_on:
      - notification
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6004/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  recipe-book:
    build:
      context: .
      dockerfile: apps/recipe-book/Dockerfile
    container_name: recipe-book
    labels:
      - 'homelab.name=Receptenboek'
      - 'homelab.icon=🍳'
    ports:
      - '6005:6005'
    environment:
      - NODE_ENV=production
      - PORT=6005
      # DATA_DIR holds image blobs, generated PDFs and the Tectonic cache; the
      # structured recipe/book/category data lives in Postgres.
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      # Connection string read from the shared secrets volume (self-provisioned).
      - DATABASE_URL_FILE=/secrets/recipe_book.url
      # Tectonic caches downloaded LaTeX support files here (on the data volume).
      - TECTONIC_CACHE_DIR=/app/data/.tectonic-cache
    volumes:
      # Downloaded images, generated output + TeX cache (structured data is in DB).
      - recipe-book-data:/app/data
      - recipe-book-logs:/app/logs
      - db-secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6005/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification:
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    container_name: notification
    labels:
      - 'homelab.name=Notificaties'
      - 'homelab.icon=🔔'
    ports:
      - '6006:6006'
    environment:
      - NODE_ENV=production
      - PORT=6006
      - LOG_DIR=/app/logs
      # Connection string read from the shared secrets volume (self-provisioned).
      - DATABASE_URL_FILE=/secrets/notification.url
      # Optional shared secret required on POST /send (defence-in-depth).
      - SEND_TOKEN=${SEND_TOKEN:-}
      # Email delivery channel (SKELETON — deliver() not implemented yet). Set
      # SMTP_HOST to register the "email" channel; the rest tune the transport.
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=
      # - SMTP_PASS=
      # - SMTP_FROM=homelab@example.com
      # - SMTP_TO=you@example.com
    volumes:
      - notification-logs:/app/logs
      - db-secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6006/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Authentication: owns the persons store (email = username, hashed password,
  # roles) plus registration/login and cookie-based JWT sessions (issue #149).
  # Account data lives in Postgres (auth schema/role, self-provisioned); the only
  # local state is the JWT signing secret on the auth-secrets volume, self-generated
  # on first boot so redeploys keep existing sessions valid.
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: auth
    labels:
      - 'homelab.name=Authenticatie'
      - 'homelab.icon=🔐'
    ports:
      - '6007:6007'
    environment:
      - NODE_ENV=production
      - PORT=6007
      - LOG_DIR=/app/logs
      # Connection string read from the shared secrets volume (self-provisioned).
      - DATABASE_URL_FILE=/secrets/auth.url
      # JWT signing secret, self-provisioned on the auth-secrets volume at first boot.
      - JWT_SECRET_FILE=/auth-secrets/jwt.key
    volumes:
      - auth-logs:/app/logs
      - db-secrets:/secrets:ro
      - auth-secrets:/auth-secrets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6007/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: dashboard
    labels:
      - 'homelab.name=Dashboard'
    ports:
      # The dashboard is the homelab landing page, reached at <ip>/ via the proxy.
      # It also stays directly reachable on 6000, in line with the 600x scheme.
      - '6000:6000'
    volumes:
      # Read-only Docker socket for auto-discovery of running containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Config (manual tiles + overrides), read-only inside the container.
      - ./apps/dashboard/config:/app/config:ro
      # Persistent structured access logs.
      - dashboard-logs:/app/logs
    extra_hosts:
      # Lets the container reach services published on the host by name,
      # used for server-side health checks.
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=production
      - HOST_ADDRESS=host.docker.internal
      - PORT=6000
      - LOG_DIR=/app/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  proxy-certs:
  # Shared database storage + self-generated per-app credentials. Treat these two
  # as a matched pair (see docs/database-migration.md): wiping only one causes an
  # auth mismatch between the roles in pg-data and the passwords in db-secrets.
  pg-data:
  db-secrets:
  dynamic-vs-fixed-data:
  recipe-book-data:
  atc-logs:
  ev-crossover-logs:
  dynamic-vs-fixed-logs:
  dashboard-logs:
  recipe-book-logs:
  log-viewer-logs:
  notification-logs:
  auth-logs:
  # Self-generated JWT signing secret for the auth app; persisted so redeploys
  # don't invalidate existing sessions.
  auth-secrets:
